<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pool — Token Exchange</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--black); overflow: hidden; }
    .pool-container { position: fixed; inset: 0; z-index: 0; }
    .floating-token {
      position: absolute;
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(200,184,162,0.3);
      background: rgba(248,247,244,0.04);
      color: rgba(200,184,162,0.6);
      font-family: 'IM Fell English', serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.4s ease;
      white-space: nowrap;
      animation: floatDrift linear infinite;
    }
    .floating-token:hover {
      background: rgba(248,247,244,0.1);
      border-color: var(--accent);
      color: var(--white);
      transform: scale(1.1);
    }
    @keyframes floatDrift {
      0%   { transform: translateY(0) translateX(0); }
      25%  { transform: translateY(-15px) translateX(8px); }
      50%  { transform: translateY(-5px) translateX(-5px); }
      75%  { transform: translateY(-20px) translateX(3px); }
      100% { transform: translateY(0) translateX(0); }
    }
    .pool-ui {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    .pool-ui > * { pointer-events: auto; }
    .pool-title {
      font-size: 1.6rem; color: rgba(200,184,162,0.5);
      font-family: 'IM Fell English', serif;
      letter-spacing: 0.15em; margin-bottom: 0.5rem;
    }
    .pool-subtitle {
      font-size: 0.75rem; color: rgba(154,149,144,0.5);
      font-family: 'IM Fell English', serif;
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .pool-count {
      font-size: 0.65rem; color: rgba(154,149,144,0.3);
      letter-spacing: 0.15em; margin-top: 1rem;
    }
    /* Received token overlay */
    .received-overlay {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: rgba(26,25,23,0.92);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; padding: 2rem;
    }
    .received-overlay.active { display: flex; }
    .received-label {
      font-size: 0.65rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--accent);
    }
    .received-archetype {
      font-size: 1.3rem; color: var(--white);
      font-family: 'IM Fell English', serif; text-align: center;
    }
    .received-message {
      font-size: 0.88rem; line-height: 2; color: var(--mid);
      font-style: italic; text-align: center;
      max-width: 420px; border-left: 2px solid var(--accent);
      padding-left: 1.2rem; text-align: left;
    }
    .received-sig {
      font-size: 0.72rem; color: rgba(200,184,162,0.5);
      letter-spacing: 0.12em;
    }
    .received-close {
      background: none; border: 1px solid rgba(200,184,162,0.3);
      color: var(--mid); font-family: 'IM Fell English', serif;
      font-size: 0.78rem; padding: 0.6rem 1.8rem; cursor: pointer;
      margin-top: 1rem; transition: all 0.2s;
    }
    .received-close:hover { border-color: var(--accent); color: var(--white); }
  </style>
</head>
<body>
<div class="pool-container" id="pool-container"></div>
<div class="pool-ui">
  <div class="pool-title">The Pool</div>
  <div class="pool-subtitle">stories left behind by strangers</div>
  <div class="pool-count" id="pool-count"></div>
</div>
<div class="received-overlay" id="received-overlay">
  <div class="received-label">a stranger left this for you</div>
  <div class="received-archetype" id="recv-archetype"></div>
  <div class="received-message" id="recv-message"></div>
  <div class="received-sig" id="recv-sig"></div>
  <button class="received-close" onclick="closeReceived()">let it go</button>
</div>
<script src="pool.js"></script>
</body>
</html>
